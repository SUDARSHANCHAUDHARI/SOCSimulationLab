[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socsimulationlab"
version = "1.0.0"
description = "End-to-end SOC workflow simulator that maps attack scenarios to collected logs and visibility gaps"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
soc-sim = "main:main"
